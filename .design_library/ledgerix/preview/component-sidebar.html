<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:var(--space-3);background:var(--background);font-family:var(--font-body);color:var(--foreground)}
.row{display:flex;gap:var(--space-4);align-items:flex-start;flex-wrap:wrap}
.label{display:block;width:92px;font-size:var(--font-size-caption);text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);padding-top:var(--space-2);flex-shrink:0}
.divider{border:none;border-top:1px solid var(--border);margin:var(--space-4) 0}
.sidebar{background:var(--sidebar);backdrop-filter:var(--blur-glass-heavy);-webkit-backdrop-filter:var(--blur-glass-heavy);color:var(--ledgerix-neutral-100);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-full{width:240px;height:340px;padding:var(--space-4) var(--space-3)}
.brand{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-2) var(--space-4)}
.brand-mark{width:24px;height:24px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.brand-name{font-weight:600;font-size:14px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:var(--space-1)}
.nav-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);border-radius:var(--radius-md);color:var(--ledgerix-neutral-300);text-decoration:none;white-space:nowrap;font-size:14px;transition:background .15s,color .15s}
.nav-item svg,.avatar svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item svg{width:20px;height:20px}
.nav-item:hover{background:var(--muted);color:var(--foreground)}
.nav-item.active{background:var(--surface-container);color:var(--foreground)}
.sb-footer{margin-top:auto;padding-top:var(--space-4)}
.user{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);color:var(--ledgerix-neutral-300);font-size:13px;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:var(--radius-full);background:var(--ledgerix-neutral-700);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar svg{width:14px;height:14px}
.sb-rail{width:64px;height:340px;padding:var(--space-4) var(--space-2);align-items:center}
.sb-rail .brand{justify-content:center;padding:var(--space-1) 0 var(--space-4)}
.sb-rail .brand-mark{width:32px;height:32px}
.sb-rail .nav-item{justify-content:center;width:var(--size-button-md);padding:var(--space-2) 0}
.sb-rail .user{justify-content:center;padding:var(--space-2) 0}
.sb-rail .avatar{width:32px;height:32px}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-dash" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></symbol>
<symbol id="i-fc" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
</svg>
<div class="row">
<span class="label">Full</span>
<aside class="sidebar sb-full" data-evidence-sample="Full">
<div class="brand"><span class="brand-mark">L</span><span class="brand-name">Ledgerix</span></div>
<nav class="nav">
<a class="nav-item active" href="#"><svg><use href="#i-dash"/></svg>Dashboard</a>
<a class="nav-item" href="#"><svg><use href="#i-up"/></svg>Revenue</a>
<a class="nav-item" href="#"><svg><use href="#i-down"/></svg>Expenses</a>
<a class="nav-item" href="#"><svg><use href="#i-fc"/></svg>Forecast</a>
</nav>
<div class="sb-footer">
<a class="nav-item" href="#">Settings</a>
<div class="user"><span class="avatar"><svg><use href="#i-user"/></svg></span>Alex Morgan</div>
</div>
</aside>
</div>
<hr class="divider">
<div class="row">
<span class="label">Rail</span>
<aside class="sidebar sb-rail" data-evidence-sample="Rail">
<div class="brand"><span class="brand-mark">L</span></div>
<nav class="nav">
<a class="nav-item active" href="#"><svg><use href="#i-dash"/></svg></a>
<a class="nav-item" href="#"><svg><use href="#i-up"/></svg></a>
<a class="nav-item" href="#"><svg><use href="#i-down"/></svg></a>
<a class="nav-item" href="#"><svg><use href="#i-fc"/></svg></a>
</nav>
<div class="sb-footer"><div class="user"><span class="avatar"><svg><use href="#i-user"/></svg></span></div></div>
</aside>
</div>
</body>
</html>
