<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--background); font-family: var(--font-body); color: var(--foreground); }
.stage { max-width: 720px; margin: 0 auto; }
.story { margin-bottom: var(--space-2); }
.story-label { display: block; width: 92px; font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); margin-bottom: var(--space-2); }
.rail { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.divider { border: none; border-top: 1px solid var(--border); margin: var(--space-4) 0; }

/* @component-css-start */
.bottomnav { display: flex; width: 100%; max-width: 420px; height: 60px; background: var(--card); backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass); border-top: 1px solid var(--border); }
.bottomnav a { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); color: var(--muted-foreground); white-space: nowrap; transition: background .15s, color .15s; }
.bottomnav a:hover { background: var(--surface-container); }
.bottomnav a[aria-current="page"] { color: var(--foreground); }
.topnav { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-2) var(--space-4); background: var(--card); backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.topnav .brand { font-family: var(--font-display); font-weight: var(--font-weight-display); font-size: var(--font-size-h4); color: var(--foreground); text-decoration: none; white-space: nowrap; }
.topnav nav { display: flex; align-items: center; gap: var(--space-5); }
.topnav nav a { text-decoration: none; font-size: var(--font-size-body); font-weight: var(--font-weight-body); color: var(--muted-foreground); white-space: nowrap; transition: color .15s; }
.topnav nav a:hover { color: var(--foreground); }
.topnav nav a[aria-current="page"] { color: var(--foreground); font-weight: var(--font-weight-h4); }
.cta { display: inline-flex; align-items: center; min-width: var(--size-button-md); height: var(--size-button-md); padding: 0 var(--space-4); background: var(--primary); color: var(--primary-foreground); border: none; border-radius: var(--radius-md); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-h4); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s; }
.cta:hover { background: var(--accent-hover); }
/* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">
    <div class="story">
      <span class="story-label">Bottom Nav</span>
      <div class="rail" data-evidence-sample="Bottom Nav (mobile)">
        <nav class="bottomnav" aria-label="Primary">
          <a href="#" aria-current="page">Home</a>
          <a href="#">Income</a>
          <a href="#">Forecast</a>
          <a href="#">Ask AI</a>
          <a href="#">Profile</a>
        </nav>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="stage">
    <div class="story">
      <span class="story-label">Top Nav</span>
      <div class="rail" data-evidence-sample="Top Nav">
        <header class="topnav">
          <a href="#" class="brand">Ledgerix</a>
          <nav aria-label="Secondary">
            <a href="#" aria-current="page">Home</a>
            <a href="#">Income</a>
            <a href="#">Forecast</a>
            <a href="#" class="cta">Ask AI</a>
          </nav>
        </header>
      </div>
    </div>
  </div>
</div>
</body>
</html>
