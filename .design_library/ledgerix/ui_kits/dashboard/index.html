<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<style>
body{margin:0;background:var(--background);color:var(--color-foreground);font-family:var(--font-body)}
.uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:var(--uikit-sidebar-w, 220px) minmax(0,1fr);gap:var(--space-4)}
.uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
.uikit-sidebar{overflow:hidden;max-width:100%;height:auto;align-self:stretch}
[data-component]{min-width:0;max-width:100%;overflow:hidden}
.uikit-main{min-width:0;display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4)}
.uikit-screen{display:flex;flex-direction:column;gap:var(--space-4);min-width:0;animation:uikitIn .28s cubic-bezier(.3,0,0,1)}
@keyframes uikitIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.uikit-toolbar{display:flex;align-items:center;gap:var(--space-2);background:var(--card);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4)}
.uikit-titleblock{flex:1 1 auto;min-width:0}
.uikit-title{margin:0;font-family:var(--font-heading);font-size:var(--font-size-h3);font-weight:var(--font-weight-h2);line-height:1.25}
.uikit-subtitle{margin:2px 0 0;font-size:var(--font-size-caption);color:var(--color-muted-foreground)}
.uikit-controls{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.uikit-search{display:flex;align-items:center;gap:var(--space-2);height:var(--size-input-height);width:220px;flex:0 1 220px;min-width:0;padding:0 var(--space-3);background:var(--surface-container-low);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.uikit-search input{flex:1;min-width:0;border:none;background:transparent;outline:none;color:var(--color-foreground);font-family:var(--font-body);font-size:var(--font-size-body)}
.uikit-search input::placeholder{color:var(--color-muted-foreground)}
.uikit-search:focus-within{outline:2px solid var(--ring);outline-offset:1px}
.uikit-iconbtn{width:var(--size-input-height);height:var(--size-input-height);display:inline-flex;align-items:center;justify-content:center;background:var(--surface-container-low);border:1px solid var(--color-border);border-radius:var(--radius-md);color:var(--color-muted-foreground);cursor:pointer;transition:background .15s,color .15s}
.uikit-iconbtn:hover{background:var(--surface-container);color:var(--color-foreground)}
.uikit-iconbtn-sm{width:var(--size-button-sm);height:var(--size-button-sm);display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--radius-sm);color:var(--color-muted-foreground);cursor:pointer;flex-shrink:0}
.uikit-iconbtn-sm:hover{background:var(--muted);color:var(--color-foreground)}
.uikit-responsive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);min-width:0}
.uikit-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.uikit-tbl-minw table{min-width:620px}
.uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-nowrap{white-space:nowrap;flex-shrink:0}
.uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
.uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-figures{font-variant-numeric:tabular-nums}
.uikit-card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-width:0}
.uikit-card-actions{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.uikit-desc{max-width:190px}
.uikit-insight-stack{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.uikit-chat{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.uikit-msg{display:flex;align-items:flex-start;gap:var(--space-2);min-width:0}
.uikit-msg.user{justify-content:flex-end}
.uikit-bubble{padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);font-size:var(--font-size-body);line-height:var(--line-height-body);max-width:78%;min-width:0}
.uikit-bubble.bot{background:var(--surface-container);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);border:1px solid var(--border);border-bottom-left-radius:var(--radius-sm)}
.uikit-bubble.user{background:var(--primary);color:var(--primary-foreground);border-bottom-right-radius:var(--radius-sm)}
.uikit-composer{display:flex;gap:var(--space-2);min-width:0;margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--color-border)}
.uikit-input{flex:1;min-width:0;height:var(--size-input-height);padding:0 var(--space-3);background:var(--surface-container-low);border:1px solid var(--color-border);border-radius:var(--radius-md);color:var(--color-foreground);font-family:var(--font-body);font-size:var(--font-size-body)}
.uikit-input::placeholder{color:var(--color-muted-foreground)}
.uikit-input:focus{outline:2px solid var(--ring);outline-offset:1px}
.uikit-chart-svg{width:100%;height:auto;display:block}
.uikit-bars{display:flex;gap:var(--space-1);min-width:0;margin-top:var(--space-3)}
.uikit-barcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.uikit-barpair{height:120px;display:flex;align-items:flex-end;gap:3px}
.uikit-bar{width:10px;border-radius:var(--radius-sm);flex-shrink:0}
.uikit-bar-a{background:var(--foreground)}
.uikit-bar-p{background:var(--ledgerix-neutral-500)}
.barH40{height:40%}.barH44{height:44%}.barH48{height:48%}.barH52{height:52%}.barH56{height:56%}.barH60{height:60%}.barH64{height:64%}.barH68{height:68%}.barH72{height:72%}.barH76{height:76%}.barH80{height:80%}.barH84{height:84%}.barH88{height:88%}.barH92{height:92%}.barH96{height:96%}.barH100{height:100%}
.uikit-barlabel{margin-top:var(--space-2);font-size:var(--font-size-caption);color:var(--color-muted-foreground);white-space:nowrap}
.uikit-mobilebar{display:none}
.uikit-mobilebar .bottomnav{margin:0 auto}
@media (max-width: 900px){.uikit-shell{grid-template-columns:minmax(0,1fr)}.uikit-sidebar{display:none}.uikit-mobilebar{display:block}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}.uikit-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 640px){.uikit-toolbar{flex-direction:column;align-items:stretch}.uikit-controls{flex-wrap:wrap}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}.uikit-grid-4{grid-template-columns:minmax(0,1fr)}.uikit-main{padding:var(--space-3)}.uikit-shell{gap:var(--space-3)}}
@media (prefers-reduced-motion: reduce){.uikit-screen{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const NAV_ITEMS = [
  { label: 'Dashboard', icon: 'layout-dashboard', screen: 'overview' },
  { label: 'Revenue', icon: 'trending-up', screen: 'overview' },
  { label: 'Transactions', icon: 'receipt', screen: 'overview' },
  { label: 'Forecast', icon: 'target', screen: 'forecast' },
  { label: 'Ask AI', icon: 'sparkles', screen: 'assistant' },
  { label: 'Settings', icon: 'settings', screen: null }
];

const METRICS = [
  { label: 'Monthly Income', value: '$39,640', delta: '+12.4%', up: true },
  { label: 'Net Profit', value: '$10,820', delta: '+4.8%', up: true },
  { label: 'Cash on Hand', value: '$86,410', delta: '+9.1%', up: true },
  { label: 'Overdue Receivables', value: '$3,240', delta: '−18.2%', up: false }
];

const TXNS = [
  { date: 'Aug 20', desc: 'Bluebird Café · wholesale order', cat: 'Wholesale', amt: '$1,840.00', status: 'paid' },
  { date: 'Aug 19', desc: 'Maple & Co. · espresso beans', cat: 'Wholesale', amt: '$2,120.00', status: 'pending' },
  { date: 'Aug 18', desc: 'Storefront · retail sales', cat: 'Retail', amt: '$486.50', status: 'paid' },
  { date: 'Aug 16', desc: 'Harbor Roasters · subscription', cat: 'Wholesale', amt: '$960.00', status: 'paid' },
  { date: 'Aug 15', desc: 'Warehouse rent · August', cat: 'Rent', amt: '$1,400.00', status: 'overdue' },
  { date: 'Aug 14', desc: 'Payroll · baristas', cat: 'Payroll', amt: '$3,120.00', status: 'paid' },
  { date: 'Aug 12', desc: 'Green bean supplier · Kenya AA', cat: 'Supplies', amt: '$2,450.00', status: 'pending' }
];

const INSIGHTS = [
  { text: 'Wholesale revenue is up 14% this quarter, led by repeat orders from Bluebird Café and Maple & Co. Two accounts now make up 38% of income.', conf: 'High confidence', link: 'Review revenue' },
  { text: 'Overdue receivables fell 18% after the August reminder batch. Moving net terms to 14 days could cut late payments by a further 40%.', conf: 'Medium confidence', link: 'Adjust terms' }
];

const CHAT = [
  { who: 'user', text: 'Why did cash on hand dip in early March?' },
  { who: 'bot', text: 'March cash dipped because two wholesale invoices totaling $4,120 cleared late and the roaster service payment landed early. Both were one-off. April cash recovered to $86k.' },
  { who: 'user', text: 'Should I extend Bluebird Café to 30-day terms?' },
  { who: 'bot', text: 'Bluebird has paid 14 of 15 invoices on time. Extending terms is low risk — it frees about $2.4k of working capital by Q4 without changing your cash floor.' }
];

const FORECAST = [
  { m: 'Jul', p: '$36,200', a: '$37,040', v: '+2.3%', up: true },
  { m: 'Aug', p: '$38,900', a: '$39,640', v: '+1.9%', up: true },
  { m: 'Sep', p: '$38,400', a: '$38,120', v: '−0.7%', up: false },
  { m: 'Oct', p: '$41,200', a: '$41,780', v: '+1.4%', up: true },
  { m: 'Nov', p: '$43,800', a: '$44,360', v: '+1.3%', up: true },
  { m: 'Dec', p: '$48,000', a: '$48,940', v: '+2.0%', up: true }
];

const BARS = [
  { m: 'Jan', a: 'barH56', p: 'barH56' }, { m: 'Feb', a: 'barH60', p: 'barH60' },
  { m: 'Mar', a: 'barH60', p: 'barH64' }, { m: 'Apr', a: 'barH68', p: 'barH68' },
  { m: 'May', a: 'barH68', p: 'barH68' }, { m: 'Jun', a: 'barH68', p: 'barH72' },
  { m: 'Jul', a: 'barH72', p: 'barH76' }, { m: 'Aug', a: 'barH80', p: 'barH76' },
  { m: 'Sep', a: 'barH76', p: 'barH76' }, { m: 'Oct', a: 'barH84', p: 'barH84' },
  { m: 'Nov', a: 'barH88', p: 'barH88' }, { m: 'Dec', a: 'barH96', p: 'barH100' }
];

function Toolbar({ title, sub, children }) {
  return (
    <div className="uikit-toolbar">
      <div className="uikit-titleblock">
        <h1 className="uikit-title">{title}</h1>
        <p className="uikit-subtitle">{sub}</p>
      </div>
      <div className="uikit-controls">
        <div className="uikit-search">
          <i data-lucide="search" style={{ width: '16px', height: '16px', display: 'inline-block' }}></i>
          <input type="text" placeholder="Search" aria-label="Search" />
        </div>
        <button className="uikit-iconbtn" aria-label="Notifications">
          <i data-lucide="bell" style={{ width: '20px', height: '20px', display: 'inline-block' }}></i>
        </button>
        {children}
        <span className="avatar">
          <i data-lucide="circle-user-round" style={{ width: '14px', height: '14px', display: 'inline-block' }}></i>
        </span>
      </div>
    </div>
  );
}

function Metric({ label, value, delta, up }) {
  return (
    <div className="metric-card" data-component="card">
      <span className="metric-label">{label}</span>
      <span className="metric-value uikit-figures">{value}</span>
      <span className={up ? 'delta delta-up' : 'delta delta-down'}>{delta}</span>
    </div>
  );
}

function Overview() {
  return (
    <div className="uikit-screen">
      <Toolbar title="Revenue Overview" sub="All accounts · August 2026">
        <button className="btn btn-secondary size-md" data-component="button">Add Income</button>
        <button className="btn btn-primary size-md" data-component="button">Export Report</button>
      </Toolbar>
      <div className="uikit-responsive-grid uikit-grid-4">
        {METRICS.map((m) => <Metric key={m.label} {...m} />)}
      </div>
      <div className="card" data-component="chart">
        <div className="ctitle">Revenue — actual vs projected</div>
        <div className="cvalue uikit-figures">$265,040 · year to date</div>
        <div className="legend">
          <span className="chip"><span className="dot dot-actual"></span>Actual</span>
          <span className="chip"><span className="dot dot-projected"></span>Projected</span>
        </div>
        <div className="chart">
          <svg className="uikit-chart-svg" viewBox="0 0 560 240" role="img" aria-label="Revenue actual versus projected by month">
            <defs>
              <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" style={{ stopColor: '#f5f5f5' }} stopOpacity="0.1" />
                <stop offset="100%" style={{ stopColor: '#f5f5f5' }} stopOpacity="0.01" />
              </linearGradient>
            </defs>
            <path className="area" d="M30,160 L76,149 L121,153 L167,133 L212,125 L258,130 L303,108 L349,92 L394,101 L440,79 L485,64 L531,37 L531,210 L30,210 Z"></path>
            <line className="axis" x1="30" y1="210" x2="531" y2="210"></line>
            <line className="axis" x1="30" y1="120" x2="531" y2="120"></line>
            <path className="line-projected" d="M76,155 L121,157 L167,139 L212,129 L258,133 L303,113 L349,97 L394,100 L440,83 L485,67 L531,42"></path>
            <path className="line-actual" d="M30,160 L76,149 L121,153 L167,133 L212,125 L258,130 L303,108 L349,92 L394,101 L440,79 L485,64 L531,37"></path>
            <circle className="marker" cx="531" cy="37" r="4"></circle>
            <text className="tick" x="2" y="214">$20k</text>
            <text className="tick" x="2" y="124">$40k</text>
            <text className="tick" x="2" y="34">$50k</text>
            <text className="tick" x="30" y="226">Jan</text>
            <text className="tick" x="121" y="226">Mar</text>
            <text className="tick" x="212" y="226">May</text>
            <text className="tick" x="303" y="226">Jul</text>
            <text className="tick" x="394" y="226">Sep</text>
            <text className="tick" x="485" y="226">Nov</text>
          </svg>
        </div>
      </div>
      <div className="card" data-component="table">
        <div className="card-header uikit-card-head">
          <h2 className="card-title">Recent Transactions</h2>
          <div className="uikit-card-actions">
            <button className="btn btn-secondary size-sm" data-component="button" disabled>Bulk edit</button>
            <a className="card-link" href="#">View all</a>
          </div>
        </div>
        <div className="uikit-table-wrap uikit-tbl-minw">
          <div className="table">
            <table>
              <thead>
                <tr><th>Date</th><th>Description</th><th>Category</th><th className="num">Amount</th><th>Status</th><th></th></tr>
              </thead>
              <tbody>
                {TXNS.map((t) => (
                  <tr key={t.date + t.desc}>
                    <td className="uikit-nowrap">{t.date}</td>
                    <td className="uikit-truncate uikit-desc">{t.desc}</td>
                    <td className="uikit-nowrap">{t.cat}</td>
                    <td className="num amt uikit-figures">{t.amt}</td>
                    <td><span className={'badge ' + t.status + ' uikit-nowrap'}>{t.status.charAt(0).toUpperCase() + t.status.slice(1)}</span></td>
                    <td>
                      <div className="uikit-action-cell">
                        <button className="btn btn-ghost size-sm uikit-action" data-component="button">View</button>
                        <button className="uikit-iconbtn-sm" aria-label="More actions">
                          <i data-lucide="more-horizontal" style={{ width: '16px', height: '16px', display: 'inline-block' }}></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr><td className="uikit-nowrap" colSpan="3">Total · August to date</td><td className="num amt uikit-figures">$12,376.50</td><td colSpan="2"></td></tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function Assistant() {
  return (
    <div className="uikit-screen">
      <Toolbar title="AI Assistant" sub="Insights and answers · August 2026" />
      <div className="uikit-responsive-grid">
        <div className="uikit-insight-stack">
          {INSIGHTS.map((it) => (
            <div className="insight-card" data-component="card" key={it.conf}>
              <p className="insight-text">{it.text}</p>
              <div className="insight-foot">
                <span className="confidence-tag">{it.conf}</span>
                <a className="card-link" href="#">{it.link}</a>
              </div>
            </div>
          ))}
        </div>
        <div className="card" data-component="card">
          <div className="card-header">
            <h2 className="card-title">Ask AI</h2>
          </div>
          <div className="uikit-chat">
            {CHAT.map((msg, i) => (
              <div key={i} className={'uikit-msg' + (msg.who === 'user' ? ' user' : '')}>
                {msg.who === 'bot' &&
                  <span className="avatar">
                    <i data-lucide="sparkles" style={{ width: '14px', height: '14px', display: 'inline-block' }}></i>
                  </span>}
                <div className={'uikit-bubble ' + msg.who}>{msg.text}</div>
              </div>
            ))}
          </div>
          <div className="uikit-composer">
            <input className="uikit-input" type="text" placeholder="Ask anything about your books…" aria-label="Ask the AI assistant" />
            <button className="btn btn-ghost size-md" data-component="button" disabled>Attach</button>
            <button className="btn btn-primary size-md" data-component="button">Ask AI</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Forecast() {
  return (
    <div className="uikit-screen">
      <Toolbar title="Sales Forecast" sub="H2 plan · July–December 2026">
        <button className="btn btn-secondary size-md" data-component="button">Adjust plan</button>
        <button className="btn btn-primary size-md" data-component="button">Export Report</button>
      </Toolbar>
      <div className="uikit-responsive-grid uikit-grid-4">
        <Metric label="Q3 Projected" value="$113,500" delta="+8.2%" up />
        <Metric label="YTD Actual" value="$265,040" delta="+6.4%" up />
        <Metric label="Forecast Confidence" value="87%" delta="+3.1%" up />
      </div>
      <div className="card" data-component="chart">
        <div className="ctitle">Sales forecast — projected vs actual</div>
        <div className="cvalue uikit-figures">$431,200 · full-year projection</div>
        <div className="legend">
          <span className="chip"><span className="dot dot-actual"></span>Actual</span>
          <span className="chip"><span className="dot dot-projected"></span>Projected</span>
        </div>
        <div className="chart">
          <div className="uikit-bars" role="img" aria-label="Monthly actual and projected sales">
            {BARS.map((b) => (
              <div className="uikit-barcol" key={b.m}>
                <div className="uikit-barpair">
                  <div className={'uikit-bar uikit-bar-a ' + b.a}></div>
                  <div className={'uikit-bar uikit-bar-p ' + b.p}></div>
                </div>
                <span className="uikit-barlabel">{b.m}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="card" data-component="table">
        <div className="card-header uikit-card-head">
          <h2 className="card-title">Forecast vs actual</h2>
          <div className="uikit-card-actions">
            <button className="btn btn-secondary size-sm" data-component="button" disabled>Download CSV</button>
            <a className="card-link" href="#">View details</a>
          </div>
        </div>
        <div className="uikit-table-wrap uikit-tbl-minw">
          <div className="table">
            <table>
              <thead>
                <tr><th>Month</th><th className="num">Projected</th><th className="num">Actual</th><th className="num">Variance</th></tr>
              </thead>
              <tbody>
                {FORECAST.map((f) => (
                  <tr key={f.m}>
                    <td className="uikit-nowrap">{f.m}</td>
                    <td className="num amt uikit-figures">{f.p}</td>
                    <td className="num uikit-figures">{f.a}</td>
                    <td className="num"><span className={f.up ? 'delta delta-up' : 'delta delta-down'}>{f.v}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('overview');
  useEffect(() => {
    if (window.lucide) { window.lucide.createIcons(); }
  });
  const go = (s) => setScreen(s);
  return (
    <div className="uikit-shell" data-layout-guard="uikit-v1" style={{ '--uikit-sidebar-w': '240px' }}>
      <aside className="uikit-sidebar sidebar sb-full" data-component="sidebar">
        <div className="brand">
          <span className="brand-mark">L</span>
          <span className="brand-name">Ledgerix</span>
        </div>
        <nav className="nav" aria-label="Workspace">
          {NAV_ITEMS.map((n) => (
            <a
              key={n.label}
              href="#"
              className={'nav-item' + (n.screen === screen ? ' active' : '')}
              onClick={(e) => { e.preventDefault(); if (n.screen) go(n.screen); }}
            >
              <i data-lucide={n.icon} style={{ width: '20px', height: '20px', display: 'inline-block' }}></i>
              <span className="uikit-truncate">{n.label}</span>
            </a>
          ))}
        </nav>
        <div className="sb-footer">
          <div className="user">
            <span className="avatar">
              <i data-lucide="circle-user-round" style={{ width: '14px', height: '14px', display: 'inline-block' }}></i>
            </span>
            <span className="uikit-truncate">Ava Chen</span>
          </div>
        </div>
      </aside>
      <main className="uikit-main">
        {screen === 'overview' && <Overview />}
        {screen === 'assistant' && <Assistant />}
        {screen === 'forecast' && <Forecast />}
        <div className="uikit-mobilebar">
          <nav className="bottomnav" aria-label="Primary" data-component="navigation">
            <a href="#" aria-current={screen === 'overview' ? 'page' : undefined} onClick={(e) => { e.preventDefault(); go('overview'); }}>
              <i data-lucide="home" style={{ width: '20px', height: '20px', display: 'inline-block' }}></i>Home
            </a>
            <a href="#" aria-current={screen === 'overview' ? 'page' : undefined} onClick={(e) => { e.preventDefault(); go('overview'); }}>
              <i data-lucide="dollar-sign" style={{ width: '20px', height: '20px', display: 'inline-block' }}></i>Income
            </a>
            <a href="#" aria-current={screen === 'forecast' ? 'page' : undefined} onClick={(e) => { e.preventDefault(); go('forecast'); }}>
              <i data-lucide="target" style={{ width: '20px', height: '20px', display: 'inline-block' }}></i>Forecast
            </a>
            <a href="#" aria-current={screen === 'assistant' ? 'page' : undefined} onClick={(e) => { e.preventDefault(); go('assistant'); }}>
              <i data-lucide="sparkles" style={{ width: '20px', height: '20px', display: 'inline-block' }}></i>Ask AI
            </a>
          </nav>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>lucide.createIcons();</script>
</body>
</html>
